name: Authorisation policies

on:
  push:
    paths:
      - "Authorisation/**"
      - ".github/workflows/authz.yml"
  pull_request:
    paths:
      - "Authorisation/**"
      - ".github/workflows/authz.yml"

permissions:
  contents: read

jobs:
  opa:
    name: opa fmt, check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.21.3

      - name: opa fmt
        run: opa fmt --fail --list Authorisation/policies

      - name: opa check
        run: opa check --strict Authorisation/policies

      - name: opa test
        run: opa test Authorisation/policies -v

  schema:
    name: validate datasource against JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install "jsonschema==4.26.0"

      - name: Validate
        run: python Authorisation/scripts/validate_datasource.py
